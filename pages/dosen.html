<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dosen – SIAKAD</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content" id="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="btn-menu-toggle" onclick="Layout.toggleSidebar()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <span id="page-title" class="page-title">Data Dosen</span>
            </div>
            <div class="topbar-right"><span id="topbar-user" class="topbar-user"></span></div>
        </div>

        <div class="page-content clean-page staff-page">
            <div class="card clean-card">
                <div class="card-header clean-card-header staff-card-header">
                    <div class="card-title">
                        <span class="title-icon">${ICON.user}</span>
                        <div>
                            <div class="title-text">Daftar Dosen</div>
                            <div class="title-sub">Kelola data dosen, impor massal, dan tindakan cepat.</div>
                        </div>
                    </div>
                    <div class="button-group clean-actions">
                        <button class="btn btn-secondary btn-sm" id="btn-import" onclick="openImport()"><span
                                style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.plus}</span>
                            Impor Dosen</button>
                        <button class="btn btn-primary btn-sm" id="btn-tambah" onclick="openAdd()"><span
                                style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.plus}</span>
                            Tambah Dosen</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-toolbar clean-toolbar">
                        <div class="search-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="7"></circle>
                                <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                            </svg>
                            <input type="text" id="search" class="search-input search-pill"
                                placeholder="Cari NIP / Nama..." oninput="debounceSearch()">
                        </div>
                        <span id="total-info" class="pagination-info total-pill"></span>
                    </div>
                    <div class="table-container">
                        <table class="clean-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                                    <th>No</th>
                                    <th>Foto</th>
                                    <th>NIP</th>
                                    <th>Nama</th>
                                    <th>Email</th>
                                    <th>Telepon</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrap">
                        <div class="pagination" id="pagination"></div>
                    </div>
                    <div class="table-bottom" id="admin-bottom" style="display:none">
                        <button class="btn btn-danger btn-sm" onclick="bulkDelete()"><span
                                style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.trash}</span>
                            Hapus Semua Checklist</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay hidden" id="modal-form">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-form-title">Tambah Dosen</h2>
                <button class="btn-modal-close" onclick="closeModal('modal-form')">×</button>
            </div>
            <div class="modal-body">
                <form id="form-dosen">
                    <input type="hidden" id="f-id">
                    <div class="form-group" style="text-align:center">
                        <div class="photo-preview-wrap" style="margin:0 auto 6px">
                            <img id="f-photo-preview" class="photo-preview" src="" alt="Foto">
                            <label for="f-foto" class="photo-change-btn" title="Ganti Foto">${ICON.edit}</label>
                        </div>
                        <input type="file" id="f-foto" accept="image/*" style="display:none"
                            onchange="previewPhoto(this)">
                        <small style="color:var(--text-muted)">Klik foto untuk ganti. Max 5 MB</small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">NIP <span class="required">*</span></label>
                            <input type="text" id="f-nip" class="form-control" placeholder="Nomor Induk Pegawai"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telepon</label>
                            <input type="text" id="f-telepon" class="form-control" placeholder="08XXXXXXXXXX">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="f-nama" class="form-control" placeholder="Nama lengkap dosen" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="f-email" class="form-control" placeholder="email@institusi.ac.id">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Alamat</label>
                        <textarea id="f-alamat" class="form-control" rows="2" placeholder="Alamat lengkap"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modal-form')">Batal</button>
                <button class="btn btn-primary" id="btn-submit" onclick="submitForm()"><span
                        style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.save}</span>
                    Simpan</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════ MODAL IMPORT ═══════════════════════ -->
    <div class="modal-overlay hidden" id="modal-import">
        <div class="modal">
            <div class="modal-header">
                <h2><span
                        style="display:inline-block;width:20px;vertical-align:middle;margin-right:6px">${ICON.plus}</span>
                    Impor Dosen</h2>
                <button class="btn-modal-close" onclick="closeModal('modal-import')">×</button>
            </div>
            <div class="modal-body">
                <form id="form-import">
                    <div class="form-group">
                        <label class="form-label">Pilih file Excel / CSV <span class="required">*</span></label>
                        <input type="file" id="f-file" class="form-control" accept=".xlsx,.xls,.csv" required>
                        <small class="form-help">Gunakan kolom: NIP, Nama, Email, Telepon, Alamat.</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modal-import')">Batal</button>
                <button class="btn btn-primary" id="btn-import-submit" onclick="submitImport()"><span
                        style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.save}</span>
                    Proses Import</button>
            </div>
        </div>
    </div>

    <!-- Modal Detail -->
    <div class="modal-overlay hidden" id="modal-detail">
        <div class="modal">
            <div class="modal-header">
                <h2><span
                        style="display:inline-block;width:20px;vertical-align:middle;margin-right:6px">${ICON.clipboard}</span>
                    Detail Dosen</h2>
                <button class="btn-modal-close" onclick="closeModal('modal-detail')">×</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modal-detail')">Tutup</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-4cV+REg+K7U+S8J6UrnC9V0uexX8KJANXfwltB8/eO75HoPm3lQ7G6PUqQnY+3ZyK1YvQv6zsGuil8BJ1M9BbA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script>
        Layout.init('Data Dosen');
        Auth.requireRole(['ADMIN']);
        const user = Auth.getUser();
        const isAdmin = user?.role === 'ADMIN';

        if (isAdmin) document.getElementById('admin-bottom').style.display = 'flex';
        else document.getElementById('btn-tambah').style.display = 'none';

        let currentPage = 1, totalPages = 1, searchTimer;

        async function load(page = 1) {
            currentPage = page;
            const search = document.getElementById('search').value;
            const res = await API.get(`/dosen?page=${page}&limit=10&search=${encodeURIComponent(search)}`);
            if (!res.ok) { Toast.error(res.message); return; }
            const { data, pagination } = res;
            totalPages = pagination.total_pages;
            document.getElementById('total-info').textContent =
                `Menampilkan ${data.length} dari ${pagination.total} data`;

            const offset = (page - 1) * 10;
            document.getElementById('tbody').innerHTML = data.length ? data.map((d, i) => `
    <tr>
      <td><input type="checkbox" class="row-check" value="${d.id}"></td>
      <td>${offset + i + 1}</td>
      <td><img src="${API.photoUrl(d.foto)}" class="table-photo" alt="foto" onerror="this.src='${BASE_ROOT}/assets/img/avatar.png'"></td>
      <td><small>${d.nip}</small></td>
      <td><strong>${d.nama}</strong></td>
      <td>${d.email || '-'}</td>
      <td>${d.telepon || '-'}</td>
      <td class="table-actions">
        <button class="btn-icon detail" onclick="openDetail(${d.id})">${ICON.eye}</button>
        ${isAdmin ? `<button class="btn-icon edit" onclick="openEdit(${d.id})">${ICON.edit}</button>
        <button class="btn-icon del"  onclick="hapus(${d.id},'${d.nama}')">${ICON.trash}</button>` : ''}
      </td>
    </tr>`).join('')
                : `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">${ICON.inbox}</div><p>Tidak ada data dosen</p></div></td></tr>`;

            renderPagination();
        }

        function renderPagination() {
            const el = document.getElementById('pagination');
            let html = '';
            const maxBtn = 5;
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + maxBtn - 1);
            if (end - start < maxBtn - 1) start = Math.max(1, end - maxBtn + 1);
            html += `<button class="page-btn" onclick="load(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
            for (let i = start; i <= end; i++)
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="load(${i})">${i}</button>`;
            html += `<button class="page-btn" onclick="load(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
            el.innerHTML = html;
        }
        function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => load(1), 400); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function previewPhoto(input) {
            if (input.files?.[0]) { const r = new FileReader(); r.onload = e => document.getElementById('f-photo-preview').src = e.target.result; r.readAsDataURL(input.files[0]); }
        }
        function openAdd() {
            document.getElementById('form-dosen').reset();
            document.getElementById('f-id').value = '';
            document.getElementById('f-photo-preview').src = API.photoUrl(null);
            document.getElementById('modal-form-title').innerHTML = `<span style="display:inline-block;width:20px;vertical-align:middle;margin-right:6px">${ICON.plus}</span> Tambah Dosen`;
            openModal('modal-form');
        }
        async function openEdit(id) {
            const res = await API.get('/dosen/' + id);
            if (!res.ok) { Toast.error(res.message); return; }
            const d = res.data;
            document.getElementById('modal-form-title').innerHTML = `<span style="display:inline-block;width:20px;vertical-align:middle;margin-right:6px">${ICON.edit}</span> Edit Dosen`;
            document.getElementById('f-id').value = d.id;
            document.getElementById('f-nip').value = d.nip;
            document.getElementById('f-nama').value = d.nama;
            document.getElementById('f-email').value = d.email || '';
            document.getElementById('f-telepon').value = d.telepon || '';
            document.getElementById('f-alamat').value = d.alamat || '';
            document.getElementById('f-photo-preview').src = API.photoUrl(d.foto);
            openModal('modal-form');
        }
        async function openDetail(id) {
            const res = await API.get('/dosen/' + id);
            if (!res.ok) { Toast.error(res.message); return; }
            const d = res.data;
            document.getElementById('detail-body').innerHTML = `
    <div class="detail-header">
      <img src="${API.photoUrl(d.foto)}" class="detail-avatar" onerror="this.src='${BASE_ROOT}/assets/img/avatar.png'">
      <div><div class="detail-name">${d.nama}</div><div class="detail-sub">NIP: ${d.nip}</div></div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="di-label">NIP</div><div class="di-value">${d.nip}</div></div>
      <div class="detail-item"><div class="di-label">Telepon</div><div class="di-value">${d.telepon || '-'}</div></div>
      <div class="detail-item"><div class="di-label">Email</div><div class="di-value">${d.email || '-'}</div></div>
      <div class="detail-item"><div class="di-label">Bergabung</div><div class="di-value">${new Date(d.created_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}</div></div>
      <div class="detail-item" style="grid-column:span 2"><div class="di-label">Alamat</div><div class="di-value">${d.alamat || '-'}</div></div>
    </div>`;
            openModal('modal-detail');
        }
        async function submitForm() {
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.textContent = 'Menyimpan...';
            const id = document.getElementById('f-id').value;
            const fd = new FormData();
            fd.append('nip', document.getElementById('f-nip').value);
            fd.append('nama', document.getElementById('f-nama').value);
            fd.append('email', document.getElementById('f-email').value);
            fd.append('telepon', document.getElementById('f-telepon').value);
            fd.append('alamat', document.getElementById('f-alamat').value);
            if (document.getElementById('f-foto').files[0]) fd.append('foto', document.getElementById('f-foto').files[0]);
            const res = await API.post(id ? `/dosen/${id}` : '/dosen', fd, true);
            if (res.ok) { Toast.success(res.message, id ? 'Data Diperbarui' : 'Data Ditambahkan'); closeModal('modal-form'); load(id ? currentPage : 1); }
            else Toast.error(res.message);
            btn.disabled = false; btn.innerHTML = `${ICON.save} Simpan`;
        }

        function openImport() {
            document.getElementById('form-import').reset();
            document.getElementById('btn-import-submit').disabled = false;
            document.getElementById('btn-import-submit').innerHTML = `${ICON.save} Proses Import`;
            openModal('modal-import');
        }

        async function submitImport() {
            const btn = document.getElementById('btn-import-submit');
            const fileEl = document.getElementById('f-file');
            const file = fileEl.files[0];
            if (!file) {
                Toast.error('Pilih file Excel atau CSV terlebih dahulu.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const rows = await parseImportFile(file);
                const { items, errors } = buildImportItems(rows, ['nip','nama','email','telepon','alamat']);
                if (errors.length) {
                    Toast.error('Beberapa baris tidak valid. Periksa file dan coba lagi.');
                    console.warn('Import errors:', errors.join('\n'));
                }
                if (!items.length) {
                    Toast.error('Tidak ada data valid untuk diimpor.');
                    btn.disabled = false;
                    btn.innerHTML = `${ICON.save} Proses Import`;
                    return;
                }

                const res = await API.post('/dosen/import', { items });
                if (res.ok) {
                    const summary = res.data;
                    let msg = `${summary.imported} dosen berhasil diimpor.`;
                    if (summary.skipped) msg += ` ${summary.skipped} duplikat dilewati.`;
                    if (summary.errors?.length) msg += ` ${summary.errors.length} baris gagal.`;
                    Toast.success(msg, 'Import Selesai');
                    if (summary.errors?.length) console.warn('Import server errors:', summary.errors.join('\n'));
                    closeModal('modal-import');
                    load(1);
                } else {
                    Toast.error(res.message);
                }
            } catch (err) {
                console.error(err);
                Toast.error('Gagal memproses file. Pastikan format Excel/CSV sesuai.');
            }

            btn.disabled = false;
            btn.innerHTML = `${ICON.save} Proses Import`;
        }

        function parseImportFile(file) {
            return new Promise((resolve, reject) => {
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext === 'csv') {
                    const reader = new FileReader();
                    reader.onload = () => resolve(parseCsvRows(reader.result));
                    reader.onerror = () => reject(reader.error);
                    reader.readAsText(file, 'UTF-8');
                } else {
                    if (!window.XLSX) {
                        reject(new Error('Library XLSX tidak tersedia. Gunakan CSV sebagai alternatif.'));
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const data = new Uint8Array(reader.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const sheet = workbook.Sheets[workbook.SheetNames[0]];
                            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                            resolve(rows);
                        } catch (e) {
                            reject(e);
                        }
                    };
                    reader.onerror = () => reject(reader.error);
                    reader.readAsArrayBuffer(file);
                }
            });
        }

        function parseCsvRows(text) {
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            return lines.map(line => {
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const c = line[i];
                    if (c === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            cell += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (c === ',' && !inQuotes) {
                        result.push(cell);
                        cell = '';
                    } else {
                        cell += c;
                    }
                }
                result.push(cell);
                return result;
            }).filter(row => row.some(cell => cell.toString().trim() !== ''));
        }

        function buildImportItems(rows, expectedHeaders) {
            const items = [];
            const errors = [];
            const headers = rows[0]?.map(h => h.toString().trim().toLowerCase()) || [];
            const hasHeader = headers.some(h => expectedHeaders.includes(h) || expectedHeaders.some(e => e.replace(/_/g, ' ') === h));

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].map(c => c == null ? '' : c.toString().trim());
                if (row.every(cell => cell === '')) continue;
                if (i === 0 && hasHeader) continue;

                const record = {};
                if (hasHeader) {
                    for (let j = 0; j < row.length; j++) {
                        const key = headers[j] || `col${j}`;
                        record[key] = row[j];
                    }
                } else {
                    expectedHeaders.forEach((key, index) => {
                        record[key] = row[index] || '';
                    });
                }

                const item = {
                    nip: record.nip || record['nip'] || '',
                    nama: record.nama || record['nama'] || '',
                    email: record.email || record['email'] || '',
                    telepon: record.telepon || record['telepon'] || '',
                    alamat: record.alamat || record['alamat'] || '',
                };

                if (!item.nip || !item.nama) {
                    errors.push(`Baris ${i + 1}: NIP dan Nama wajib diisi.`);
                    continue;
                }
                items.push(item);
            }
            return { items, errors };
        }

        function hapus(id, nama) {
            Confirm.show(`Hapus data dosen <strong>${nama}</strong>?`, async () => {
                const res = await API.delete('/dosen/' + id);
                if (res.ok) { Toast.success(res.message, 'Berhasil'); load(currentPage); } else Toast.error(res.message);
            });
        }
        function toggleAll(cb) { document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked); }
        function bulkDelete() {
            const ids = [...document.querySelectorAll('.row-check:checked')].map(c => +c.value);
            if (!ids.length) { Toast.warning('Tidak ada data yang dipilih.'); return; }
            Confirm.show(`Hapus <strong>${ids.length}</strong> dosen yang dipilih?`, async () => {
                const res = await API.delete('/dosen/bulk-delete', { ids });
                if (res.ok) { Toast.success(res.message, 'Berhasil'); load(1); } else Toast.error(res.message);
            });
        }
        load();
    </script>
</body>

</html>
