<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar – SIA Akademik</title>
    <meta name="description" content="Daftarkan akun Sistem Informasi Akademik Terpadu UNRI Anda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
        rel="stylesheet">
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --glass-bg: rgba(120, 100, 160, 0.18);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.18);
            --input-focus: rgba(200, 180, 255, 0.35);
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --text: #f1f0f5;
            --text-muted: rgba(255, 255, 255, 0.55);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Full-screen Background ── */
        .register-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .register-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .register-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(15, 10, 30, 0.35) 0%,
                    rgba(15, 10, 30, 0.15) 40%,
                    rgba(15, 10, 30, 0.3) 100%);
        }

        /* ── Floating particles ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ── Center wrapper ── */
        .register-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ── Glass Card ── */
        .register-card {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 40px 40px 32px;
            animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.97);
        }

        @keyframes cardEnter {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Logo / Header ── */
        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-logo-img {
            width: auto;
            height: 72px;
            margin: 0 auto 18px;
            display: block;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.25));
            animation: logoFadeIn 0.8s ease forwards;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .register-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 340px;
            margin: 0 auto;
        }

        /* ── Form Groups ── */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }

        .form-label .required {
            color: #f87171;
            margin-left: 2px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
        }

        /* Select styling */
        select.form-input {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='rgba(255,255,255,0.5)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
            cursor: pointer;
        }

        select.form-input option {
            background: #1e1b2e;
            color: var(--text);
        }

        /* Password toggle */
        .btn-toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color var(--transition);
        }

        .btn-toggle-pw:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ── Primary Button ── */
        .btn-register {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.92);
            color: #2d1b69;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
            margin-top: 6px;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            background: #fff;
        }

        .btn-register:hover::before {
            opacity: 1;
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Footer ── */
        .register-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
        }

        .register-footer a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: color var(--transition);
        }

        .register-footer a:hover {
            color: var(--accent-hover);
        }

        /* ── Toast override ── */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .register-card {
                padding: 28px 22px 24px;
            }

            .register-header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* ── Selection ── */
        ::selection {
            background: rgba(167, 139, 250, 0.35);
            color: #fff;
        }

        /* ── Focus visible ── */
        :focus-visible {
            outline: 2px solid rgba(167, 139, 250, 0.5);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <!-- Background -->
    <div class="register-bg">
        <img src="../assets/img/register-bg.jpg" alt="Background">
    </div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Register Form -->
    <div class="register-wrapper">
        <div class="register-card">
            <!-- Header -->
            <div class="register-header">
                <img src="../assets/img/imagee.png" alt="Logo UNRI" class="register-logo-img">
                <h1>Buat Akun</h1>
                <p>Daftarkan akun Sistem Informasi Akademik Terpadu UNRI Anda</p>
            </div>

            <!-- Form -->
            <form id="register-form" autocomplete="on">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="username">Username <span class="required">*</span></label>
                        <div class="input-wrap">
                            <input type="text" id="username" class="form-input" placeholder="Masukkan username"
                                required autofocus autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="role">Role <span class="required">*</span></label>
                        <div class="input-wrap">
                            <select id="role" class="form-input">
                                <option value="MAHASISWA">Mahasiswa</option>
                                <option value="DOSEN">Dosen</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="email" id="email" class="form-input" placeholder="email@contoh.ac.id" required
                            autocomplete="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">Password <span class="required">*</span></label>
                        <div class="input-wrap">
                            <input type="password" id="password" class="form-input" placeholder="Min. 6 karakter"
                                required autocomplete="new-password" style="padding-right: 44px;">
                            <button type="button" class="btn-toggle-pw" id="btn-toggle-pw1" tabindex="-1"
                                aria-label="Toggle password visibility">
                                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" style="display:none;">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm">Konfirmasi Password <span
                                class="required">*</span></label>
                        <div class="input-wrap">
                            <input type="password" id="confirm" class="form-input" placeholder="Ulangi password"
                                required autocomplete="new-password" style="padding-right: 44px;">
                            <button type="button" class="btn-toggle-pw" id="btn-toggle-pw2" tabindex="-1"
                                aria-label="Toggle confirm password visibility">
                                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" style="display:none;">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register" id="btn-reg">Daftar</button>
            </form>

            <!-- Footer -->
            <div class="register-footer">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script>
        Auth.requireGuest();

        // ── Password toggle ──
        document.querySelectorAll('.btn-toggle-pw').forEach(btn => {
            btn.addEventListener('click', () => {
                const wrap = btn.closest('.input-wrap');
                const input = wrap.querySelector('input');
                const eyeOn = btn.querySelector('.icon-eye');
                const eyeOff = btn.querySelector('.icon-eye-off');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                eyeOn.style.display = isPassword ? 'none' : 'block';
                eyeOff.style.display = isPassword ? 'block' : 'none';
            });
        });

        // ── Floating particles ──
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
                p.style.animationDuration = (Math.random() * 12 + 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(p);
            }
        })();

        // ── Form submit ──
        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            const cf = document.getElementById('confirm').value;
            if (pw !== cf) { Toast.error('Konfirmasi password tidak cocok.'); return; }

            const btn = document.getElementById('btn-reg');
            btn.disabled = true;
            btn.textContent = 'Mendaftar...';

            const res = await API.post('/auth/register', {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: pw,
                role: document.getElementById('role').value,
            });

            if (res.ok) {
                Toast.success(res.message, 'Registrasi Berhasil');
                setTimeout(() => window.location.href = 'login.html', 1000);
            } else {
                Toast.error(res.message, 'Registrasi Gagal');
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }
        });
    </script>
</body>

</html>
