<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SIA Akademik</title>
    <meta name="description" content="Masuk ke Sistem Informasi Akademik untuk mengakses data akademik Anda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
        rel="stylesheet">
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --glass-bg: rgba(120, 100, 160, 0.18);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.18);
            --input-focus: rgba(200, 180, 255, 0.35);
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --text: #f1f0f5;
            --text-muted: rgba(255, 255, 255, 0.55);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ── Full-screen Background ── */
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .login-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Subtle dark overlay for contrast */
        .login-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(15, 10, 30, 0.3) 0%,
                    rgba(15, 10, 30, 0.15) 40%,
                    rgba(15, 10, 30, 0.25) 100%);
        }

        /* ── Floating particles ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ── Center wrapper ── */
        .login-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ── Glass Card ── */
        .login-card {
            width: 100%;
            max-width: 460px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 44px 40px 36px;
            animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.97);
        }

        @keyframes cardEnter {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Logo / Header ── */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo-img {
            width: auto;
            height: 72px;
            margin: 0 auto 18px;
            display: block;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.25));
            animation: logoFadeIn 0.8s ease forwards;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header h1 {
            font-weight: 800; letter-spacing: 0.5px;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* ── Form Groups ── */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
        }

        /* Password toggle */
        .btn-toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color var(--transition);
        }

        .btn-toggle-pw:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ── Remember / Forgot row ── */
        .form-extras {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-wrap input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
            border-radius: 4px;
        }

        .remember-wrap span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .forgot-link {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition);
        }

        .forgot-link:hover {
            color: var(--accent-hover);
        }

        /* ── Primary Button ── */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.92);
            color: #2d1b69;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            background: var(--surface);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 500;
        }

        /* ── Google Button ── */
        .btn-google {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
        }

        .login-footer a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: color var(--transition);
        }

        .login-footer a:hover {
            color: var(--accent-hover);
        }

        /* ── Toast override for this page ── */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
        }
        .toast {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: toastIn .25s ease;
            font-size: 14px;
        }
        .toast-icon { font-size: 18px; flex-shrink: 0; }
        .toast-body .toast-title { font-weight: 600; color: #fff; }
        .toast-body .toast-msg { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 2px; }
        .toast-close {
            margin-left: auto; background: none; color: rgba(255,255,255,0.8);
            font-size: 18px; cursor: pointer; flex-shrink: 0; border: none;
        }
        @keyframes toastIn { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: none; } }
        @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateX(30px); } }
        .toast.removing { animation: toastOut .25s ease forwards; }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .login-card {
                padding: 32px 24px 28px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }

        /* ── Selection ── */
        ::selection {
            background: rgba(167, 139, 250, 0.35);
            color: #fff;
        }

        /* ── Focus visible ── */
        :focus-visible {
            outline: 2px solid rgba(167, 139, 250, 0.5);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <!-- Background -->
    <div class="login-bg">
        <img src="../assets/img/login-bg.jpg" alt="Background" id="bg-image">
    </div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <img src="../assets/img/imagee.png" alt="Logo UNRI" class="login-logo-img">
                <h1>Selamat Datang!</h1>
                <p>Masuk ke Sistem Informasi Akademik Terpadu UNRI</p>
            </div>

            <!-- Form -->
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="username" class="form-input" placeholder="Masukkan username" required
                            autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" required
                            autocomplete="current-password" style="padding-right: 44px;">
                        <button type="button" class="btn-toggle-pw" id="btn-toggle-pw" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="display:none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-extras">
                    <label class="remember-wrap">
                    </label>
                </div>

                <button type="submit" class="btn-login" id="btn-login">Masuk</button>
            </form>


            <!-- Footer -->
            <div class="login-footer">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script>
        Auth.requireGuest();

        // ── Password toggle ──
        const pwInput = document.getElementById('password');
        const btnToggle = document.getElementById('btn-toggle-pw');
        const iconEye = document.getElementById('icon-eye');
        const iconEyeOff = document.getElementById('icon-eye-off');

        btnToggle.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            iconEye.style.display = isPassword ? 'none' : 'block';
            iconEyeOff.style.display = isPassword ? 'block' : 'none';
        });

        // ── Floating particles ──
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
                p.style.animationDuration = (Math.random() * 12 + 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(p);
            }
        })();

        // ── Form submit ──
        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            const res = await API.post('/auth/login', {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            });

            if (res.ok) {
                Auth.setSession(res.data.token, res.data.user, res.data.profile);
                const displayName = res.data.profile?.nama || res.data.user.username;
                Toast.success('Selamat datang, ' + displayName + '!', 'Login Berhasil');
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } else {
                Toast.error(res.message, 'Login Gagal');
                btn.disabled = false;
                btn.textContent = 'Masuk';
            }
        });
    </script>
</body>

</html>
