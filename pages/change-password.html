<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password – SIA Akademik</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content" id="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="btn-menu-toggle" onclick="Layout.toggleSidebar()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <span id="page-title" class="page-title">Ganti Password</span>
            </div>
            <div class="topbar-right"><span id="topbar-user" class="topbar-user"></span></div>
        </div>

        <div class="page-content">
            <div class="card change-pw-card">
                <div class="card-header"><span
                        style="display:inline-block;width:20px;vertical-align:middle;margin-right:6px"
                        data-icon="key"></span> Ubah Password</div>
                <div class="card-body">
                    <form id="pw-form">
                        <div class="form-group">
                            <label class="form-label">Password Lama <span class="required">*</span></label>
                            <input type="password" id="old" class="form-control" placeholder="Masukkan password lama"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password Baru <span class="required">*</span></label>
                            <input type="password" id="new" class="form-control" placeholder="Min. 6 karakter" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Konfirmasi Password Baru <span class="required">*</span></label>
                            <input type="password" id="conf" class="form-control" placeholder="Ulangi password baru"
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="btn-save"><span
                                style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px"
                                data-icon="save"></span> Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script>
        Layout.init('Ganti Password');

        document.getElementById('pw-form').addEventListener('submit', async e => {
            e.preventDefault();
            const nw = document.getElementById('new').value;
            const cf = document.getElementById('conf').value;
            if (nw !== cf) { Toast.error('Konfirmasi password tidak cocok.'); return; }

            const btn = document.getElementById('btn-save');
            btn.disabled = true; btn.textContent = 'Menyimpan...';

            const res = await API.post('/auth/change-password', {
                old_password: document.getElementById('old').value,
                new_password: nw,
                confirm_password: cf,
            });

            if (res.ok) {
                Toast.success(res.message, 'Berhasil');
                setTimeout(() => Auth.logout(), 1500);
            } else {
                Toast.error(res.message, 'Gagal');
                btn.disabled = false; btn.innerHTML = `<span style="display:inline-block;width:14px;vertical-align:middle;margin-right:4px">${ICON.save}</span> Simpan Perubahan`;
            }
        });
    </script>
</body>

</html>
